html,body{margin:0;height:100%;background:#121022;overflow:hidden;font-family:Archivo,system-ui,sans-serif;color:var(--paper);-webkit-user-select:none;user-select:none;touch-action:none}

#ctl button.on{border-color:var(--sodium);color:var(--sodium)}#ctl button.dim{opacity:.4}

#ov.hide,.hide{display:none!important}#ov .card{max-width:640px}
#ovt{font-family:Bungee,Archivo,sans-serif;font-weight:400;font-size:clamp(30px,7vw,58px);line-height:1.05;color:var(--sodium);margin:0 0 12px;text-shadow:3px 3px 0 var(--neon)}
#ovs{font-size:16px;line-height:1.5;margin:0 0 20px}#ovs small{opacity:.82;font-size:13px;display:inline-block;line-height:1.55}
#ovb{font:400 18px Bungee,Archivo,sans-serif;background:var(--neon);color:var(--paper);border:0;border-radius:6px;padding:12px 28px;cursor:pointer}
#cut{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);background:rgba(15,12,30,.93);border-left:4px solid var(--neon);border-radius:6px;padding:12px 16px 16px;z-index:4}
#cutName{color:var(--sodium);font-weight:800;font-size:13px;letter-spacing:.04em}#cutText{font-size:17px;margin-top:6px;line-height:1.4}
#cut .tap{position:absolute;right:14px;bottom:8px;font-size:11px;opacity:.5}

#hint{position:fixed;left:50%;transform:translateX(-50%);top:16%;background:rgba(22,20,42,.86);border:1px solid #ffffff2a;padding:8px 14px;border-radius:8px;font-size:14px;max-width:78vw;text-align:center;pointer-events:none}
#rot{display:none}
@media (orientation:portrait){#rot{display:flex;position:fixed;inset:0;z-index:9;background:#121022;align-items:center;justify-content:center;text-align:center;padding:30px;font-size:18px}}

   if(g.wait>0){g.wait-=dt;if(g.wait<=0){a.h+=Math.PI}break}
   g.glanceIn-=dt;if(g.glanceIn<=0){g.glance=1.6;a.h+=Math.PI;break}
   const tx=Math.cos(a.h)>=0?g.def.max:g.def.min;if(moveTo(a,tx,g.z0,walk,dt)){g.waitMax=rr(1.8,2.8);g.wait=g.waitMax;a.h=tx==g.def.max?0:Math.PI}}}

function updCone(g){const pos=g.cone.geometry.attributes.position.array,R=range(g),fov=g.def.boss?1.6:1.4;pos[0]=g.a.x;pos[1]=.04;pos[2]=g.a.z;
 for(let k=0;k<=g.N;k++){const a=g.a.h-fov/2+fov*k/g.N;let l=R;const ex=g.a.x+Math.cos(a)*R,ez=g.a.z+Math.sin(a)*R;
  for(const o of covers.concat(cars)){if(o.h<1.4)continue;const r=segBox(g.a.x,g.a.z,ex,ez,o);if(r)l=Math.min(l,r[0]*R)}
  let x=g.a.x+Math.cos(a)*l,z=g.a.z+Math.sin(a)*l;if(z<.05||z>Wd-.05){const t=((z<.05?.05:Wd-.05)-g.a.z)/(z-g.a.z);x=g.a.x+(x-g.a.x)*t;z=g.a.z+(z-g.a.z)*t}
  pos[(k+1)*3]=x;pos[(k+1)*3+1]=.04;pos[(k+1)*3+2]=z}
 g.cone.geometry.attributes.position.needsUpdate=true;const m=g.cone.material;
 if(g.st=='chase'){m.color.setHex(0xE8467C);m.opacity=.3}else if(g.alert>.3||g.st!='patrol'){m.color.setHex(0xF2A541);m.opacity=.24}else{m.color.setHex(0xfff0c8);m.opacity=.12}}
function render(dt){
 let eyeT=P.peek?1.25:P.crouch?.85:1.6;P.eye+=(eyeT-P.eye)*Math.min(1,dt*8);
 if(inside){camera.position.set(inside.x,1.55,inside.lookZ);}
 else camera.position.set(P.x,P.eye+(P.moving?Math.sin(time*(P.runMode?14:9))*.03:0),P.z);
 if(shake>0){camera.position.x+=rr(-.06,.06);camera.position.y+=rr(-.04,.04)}
 if(state=='cutscene'){camera.position.set(2.8,1.55,Wd+.35);P.h=-Math.PI/2;P.pitch=-.05}
 camera.rotation.y=-P.h-Math.PI/2;camera.rotation.x=P.pitch;
 for(const g of goons){placePerson(g.a,dt);updCone(g);g.cone.visible=state!='cutscene'}
 for(const c of crowds)for(const a of c.people)placePerson(a,dt);if(tib)placePerson(tib,dt);
 for(const t of items)t.s.position.y=.05+Math.abs(Math.sin(time*3+t.x))*.1;
 for(const f of fx)if(f.ring){f.r+=f.max*dt/.7;f.ring.scale.setScalar(Math.max(.01,f.r));f.ring.material.opacity=clamp01(f.t/.7)}
 if(marker.visible){markerT+=dt;marker.scale.setScalar(1+Math.sin(markerT*6)*.1)}
 renderer.render(scene,camera);drawHud()}
const v3=new THREE.Vector3();
function proj(x,y,z){v3.set(x,y,z).project(camera);if(v3.z>1||v3.z<-1)return null;return {x:(v3.x+1)/2*W,y:(1-v3.y)/2*H}}
function lbl(p,s,col,size,bg,fg){if(!p)return;hc.font=`bold ${size}px system-ui,sans-serif`;hc.textAlign='center';hc.textBaseline='middle';if(bg){const w=hc.measureText(s).width+12;hc.fillStyle=bg;hc.fillRect(p.x-w/2,p.y-11,w,22);hc.fillStyle=fg}else hc.fillStyle=col;hc.fillText(s,p.x,p.y)}
function drawHud(){hc.setTransform(DPR,0,0,DPR,0,0);hc.clearRect(0,0,W,H);
 const vg=hc.createRadialGradient(W/2,H/2,Math.min(W,H)*.35,W/2,H/2,Math.max(W,H)*.75);vg.addColorStop(0,'rgba(10,8,25,0)');vg.addColorStop(1,'rgba(10,8,25,.7)');hc.fillStyle=vg;hc.fillRect(0,0,W,H);
 if(P.crouch&&nearCover&&!P.peek&&!inside){hc.fillStyle='rgba(10,8,25,.25)';hc.fillRect(0,0,W,H)}
 const fwd={x:Math.cos(P.h),z:Math.sin(P.h)};
 for(const g of goons){const dist=Math.hypot(g.a.x-P.x,g.a.z-P.z);const top=1.85*(g.def.boss?1.1:1);
  const inFront=(g.a.x-P.x)*fwd.x+(g.a.z-P.z)*fwd.z>0;const p=inFront&&dist<30?proj(g.a.x,top+.35,g.a.z):null;
  if(p){if(g.st=='chase')lbl(p,'!','#E8467C',26);else if(g.alert>.05){lbl(p,'?','#F2A541',22);hc.fillStyle='rgba(0,0,0,.5)';hc.fillRect(p.x-20,p.y-22,40,4);hc.fillStyle='#F2A541';hc.fillRect(p.x-20,p.y-22,40*Math.min(1,g.alert),4)}
   else if(g.st=='patrol'){let frac=null,col='#3FB8AF';if(g.wait>0){frac=g.wait/g.waitMax}else if(g.glanceIn<1.2&&g.glance<=0){frac=g.glanceIn/1.2;col='#F2A541'}else if(g.glance>0){frac=g.glance/1.6;col='#E8467C'}
    if(frac!=null){hc.strokeStyle='rgba(0,0,0,.4)';hc.lineWidth=4;hc.beginPath();hc.arc(p.x,p.y,9,0,7);hc.stroke();hc.strokeStyle=col;hc.beginPath();hc.arc(p.x,p.y,9,-Math.PI/2,-Math.PI/2+Math.PI*2*clamp01(frac));hc.stroke();if(g.glance>0)lbl({x:p.x,y:p.y-18},'lingon!','#E8467C',11)}}
   if(g.sayT>0)lbl(proj(g.a.x,top+.95,g.a.z),g.say,'',13,'rgba(240,236,224,.95)','#16142A')}
  // edge indicator when they're noticing you
  if((g.alert>.05||g.st=='chase')&&!inside){let rel=Math.atan2(g.a.z-P.z,g.a.x-P.x)-P.h;rel=Math.atan2(Math.sin(rel),Math.cos(rel));const R=Math.min(W,H)*.36;
   hc.strokeStyle=g.st=='chase'?'rgba(232,70,124,.9)':`rgba(242,165,65,${.35+.6*Math.min(1,g.alert)})`;hc.lineWidth=6;hc.beginPath();hc.arc(W/2,H/2,R,rel-Math.PI/2-.18,rel-Math.PI/2+.18);hc.stroke()}}
 for(const g of dogs){if(g.bark>0)lbl(proj(g.x,1.2,g.z),'AW AW!','#E8467C',14)}
 for(const f of fx)if(f.txt){hc.globalAlpha=clamp01(f.t);lbl(proj(f.x,1.6+(1.6-f.t)*.4,f.z),f.txt,'#F5E6B8',14);hc.globalAlpha=1}
 if(state=='cutscene'){const line=CUT[Math.min(cutLine,CUT.length-1)];const sp=line[0].startsWith('BOSS')?tib:line[0]=='KULOT'&&goons[0]?goons[0].a:null;if(sp&&cutLine<4)lbl(proj(sp.x,2.4,sp.z),' ! ','',16,'#E8467C','#F0ECE0');if(cutLine<=1)shake=Math.max(shake,.08)}
 if(state=='play'&&inside){hc.fillStyle='rgba(13,10,26,.35)';hc.fillRect(0,0,W,H);hc.strokeStyle='rgba(10,8,20,.95)';hc.lineWidth=Math.min(W,H)*.12;hc.strokeRect(0,0,W,H);
  hc.textAlign='center';hc.fillStyle='#F0ECE0';hc.font='bold 16px system-ui';hc.fillText(inside.mark?'Nasa loob ka ng bahay mo. Bantayan mo sila.':'Nasa loob ka ng bahay ni '+inside.owner+'.',W/2,H*.2);
  if(!inside.mark){hc.fillStyle='#F2A541';hc.font='bold 13px system-ui';hc.fillText(inside.owner+': "Ay! Sino ka?! Lumabas ka!"',W/2,H*.2+22);hc.fillStyle='rgba(0,0,0,.5)';hc.fillRect(W/2-90,H*.2+36,180,5);hc.fillStyle='#E8467C';hc.fillRect(W/2-90,H*.2+36,180*clamp01(1-insideT/8),5)}}
 if(throwArm){hc.strokeStyle='#F2A541';hc.lineWidth=2;hc.setLineDash([6,6]);hc.strokeRect(8,8,W-16,H-16);hc.setLineDash([])}}
function hudDom(){const mode=inside?'Nasa loob':P.stun>0?'Nabangga!':P.peek?'Sumisilip':(P.crouch&&nearCover)?'Nakatago':blended?'Halo sa tao':P.runMode?'Takbo mode - maingay':P.crouch?'Nakayuko':P.moving?'Naglalakad':'Nakatayo';
 $('lvl').textContent=stg.name;$('mode').textContent=mode;$('debt').textContent='₱'+debt.toLocaleString();$('cash').textContent='₱'+cash.toLocaleString();
 $('stam').style.width=P.stam+'%';$('hung').style.width=P.hunger+'%';$('hung').style.background=P.hunger<25?'#E8467C':'#E0913A';$('dist').textContent=Math.max(0,Math.round(L-P.x))+' m';
 $('bAct').textContent=inside?'Labas':'Silip';$('bAct').classList.toggle('on',P.peek||!!inside);$('bAct').classList.toggle('dim',!inside&&!(P.crouch&&nearCover));
 $('bTago').classList.toggle('on',P.crouch);$('bRun').classList.toggle('on',P.runMode);$('bThrow').textContent='Tansan ×'+throws;$('bThrow').classList.toggle('on',throwArm);

 if(state=='cutscene'){const l=CUT[Math.min(cutLine,CUT.length-1)];$('cutName').textContent=l[0];$('cutText').textContent=l[1]}
 $('hint').classList.toggle('hide',!(hintT>0&&state=='play'))}
let last=performance.now();
function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;time+=dt;
 for(let i=fx.length-1;i>=0;i--){const f=fx[i];f.t-=dt;if(f.t<=0){if(f.ring)root.remove(f.ring);fx.splice(i,1)}}
