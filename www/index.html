  g.alert=Math.min(1.2,g.alert+rate*dt);g.lx=pl.x;g.ld=pl.d;g.lostT=0;
  if(g.st!='chase'&&g.alert>=1){g.st='chase';say(g,g.def.boss?L_BOSS:L_CHASE);for(const o of goons)if(o!==g&&o.st!='chase'&&Math.abs(o.a.x-a.x)<9){o.st='investigate';o.tx=pl.x;o.td=pl.d}}
  else if(['patrol','search','return'].includes(g.st)&&g.alert>.35){g.st='investigate';g.tx=pl.x;g.td=pl.d;say(g,L_SUS)}}
 else if(g.st!='chase')g.alert=Math.max(0,g.alert-dt*.3);
 const walk=g.def.boss?1.6:1.4;
 switch(g.st){
  case'chase':{const sp=g.def.boss?4.4:4;if(seen)moveTo(a,pl.x,pl.d,sp,dt);else{g.lostT+=dt;if(moveTo(a,g.lx,g.ld,sp*.9,dt)||g.lostT>3){g.st='search';g.search=3;g.alert=.5;say(g,L_LOST)}}
   if(!inside&&Math.abs(pl.x-a.x)<.5&&Math.abs(pl.d-a.d)<.14){caught(g);return}break}
  case'investigate':if(moveTo(a,g.tx,clamp01(g.td),walk*1.5,dt)){g.st='search';g.search=2.5}break;
  case'checkhouse':if(moveTo(a,g.checkHouse.x,.9,3.2,dt)){g.wait+=dt;if(g.wait>1){if(inside===g.checkHouse){caught(g,'They saw you go in, and searched the house.');return}g.st='search';g.search=2.5;g.wait=0}}break;
  case'search':g.search-=dt;g.flipT-=dt;if(g.flipT<=0){a.face=-a.face;g.flipT=.8}if(g.search<=0)g.st='return';break;
  case'return':if(moveTo(a,clamp(a.x,g.def.min,g.def.max),g.def.d,walk,dt)){g.st='patrol';g.wait=.5}break;
  default:if(g.wait>0){g.wait-=dt;if(g.wait<=0)a.face=-a.face}else if(moveTo(a,a.face>0?g.def.max:g.def.min,g.def.d,walk,dt))g.wait=1.6}}
function camTarget(){const half=5*W/H;let x=pl?pl.x+pl.face*1.5:0;if(pl&&inside)x=inside.x;return clamp(x,half-.5,Math.max(half-.5,L-half+.5))}
// ---- render ----
const sx=x=>W/2+(x-camX)*U+(shake>0?rr(-4,4):0),sy=y=>H/2-y*U;
function rectW(x0,x1,y0,y1,col){ctx.fillStyle=col;ctx.fillRect(sx(x0),sy(y1),(x1-x0)*U,(y1-y0)*U)}
function img(im,x,y,scale,flip,alpha,center){const w=im.width*U/PPU*scale,h=im.height*U/PPU*scale,X=sx(x),Y=sy(y);if(X+w<0||X-w>W)return;ctx.globalAlpha=alpha==null?1:alpha;
 ctx.save();ctx.translate(X,center?Y:Y);if(flip)ctx.scale(-1,1);ctx.drawImage(im,-w/2,center?-h/2:-h,w,h);ctx.restore();ctx.globalAlpha=1}
function frameOf(a){return a.crouch?2:(a.moving&&Math.floor(a.anim/.18)%2==1?1:0)}
function headY(a){return Yd(a.d)+1.75*Sc(a.d)}
function label(x,y,s,col,size,bg,fg){ctx.font=`bold ${size}px system-ui,sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';const X=sx(x),Y=sy(y);
 if(bg){const w=ctx.measureText(s).width+12;ctx.fillStyle=bg;ctx.fillRect(X-w/2,Y-10,w,20);ctx.fillStyle=fg;ctx.fillText(s,X,Y)}else{ctx.fillStyle=col;ctx.fillText(s,X,Y)}}
function draw(dt){ctx.setTransform(DPR,0,0,DPR,0,0);ctx.fillStyle='#121022';ctx.fillRect(0,0,W,H);if(!stg)return;
 ctx.imageSmoothingEnabled=false;
 for(let x=-12;x<L+24;x+=10)img(ART.skyline,x+camX*.6,-1.6,1,false,1);
 // ground
 if(stg.road){rectW(-12,L+12,-5.5,Yd(.2),'#5A5560');rectW(-12,L+12,Yd(.2)-.06,Yd(.2),'#8A8590');rectW(-12,L+12,Yd(.2),Yd(.72),'#26252E');
  for(let k=0;k<stg.lanes.length-1;k++){const ld=(stg.lanes[k]+stg.lanes[k+1])/2;for(let x=Math.floor((camX-12)/2.2)*2.2;x<camX+12;x+=2.2)rectW(x,x+1.1,Yd(ld)-.03,Yd(ld)+.03,'rgba(216,208,160,.55)')}
  rectW(-12,L+12,Yd(.72),Yd(.72)+.07,'#8A8590');rectW(-12,L+12,Yd(.72)+.07,Yd(1)+.1,'#4E4A55')}
 else{rectW(-12,L+12,-5.5,Yd(1)+.1,'#3A3640');rectW(-12,L+12,Yd(.02)-.05,Yd(.02)+.05,'#24222A')}
 for(const h of stg.houses)img(h.terminal?ART.terminal:h.mark?ART.markHouse:h.store?ART.store:ART.houses[h.variant],h.x,Yd(1)-.02,1,false,1);
 for(let x=7.5;x<L+15;x+=15)img(ART.pole,x,Yd(1)-.05,1);for(let x=0;x<L+15;x+=HouseW)img(ART.wire,x,1.25,1);
 const blind=(hidden&&!peeking)||!!inside;
 // cones
 if(state!='cutscene'&&!blind)for(const g of goons){const r=range(g),x1=g.a.x+g.a.face*r,dlo=Math.max(0,g.a.d-.45),dhi=Math.min(1,g.a.d+.45);
  const col=g.st=='chase'?'232,70,124,':(g.alert>.3||['investigate','search','checkhouse'].includes(g.st))?'242,165,65,':'255,240,200,';const a0=g.st=='chase'?.3:g.alert>.3||g.st!='patrol'?.25:.12;
  const gr=ctx.createLinearGradient(sx(g.a.x),0,sx(x1),0);gr.addColorStop(0,`rgba(${col}${a0})`);gr.addColorStop(1,`rgba(${col}${a0*.15})`);ctx.fillStyle=gr;
  ctx.beginPath();ctx.moveTo(sx(g.a.x),sy(Yd(g.a.d)));ctx.lineTo(sx(x1),sy(Yd(dlo)));ctx.lineTo(sx(x1),sy(Yd(dhi)));ctx.closePath();ctx.fill()}
 for(const f of fx)if(!f.txt){ctx.strokeStyle=`rgba(${f.c},${clamp01(f.t/.6)})`;ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(sx(f.x),sy(Yd(f.d)),Math.max(1,f.r*U),Math.max(1,f.r*U*.3),0,0,7);ctx.stroke()}
 // sorted sprites
 const list=[];const add=(o,f)=>list.push({o,f});
 for(const b of stg.blocks)for(let x=b.x0+1;x<b.x1;x+=2)add(Ord(b.d0+.12),()=>img(ART.barrier,x,Yd(b.d0+.12),Sc(b.d0+.12)));
 if(stg.terminal)add(Ord(.88),()=>img(ART.bus,L-2.6,Yd(.88),Sc(.88)));
 for(const c of covers)add(Ord(c.def.d)+1,()=>img(c.img,c.def.x,Yd(c.def.d),Sc(c.def.d),c.flip));
 for(const t of items)add(Ord(t.d),()=>img(t.k=='F'?ART.food:ART.cash,t.x,Yd(t.d)+.05+Math.abs(Math.sin(time*3+t.x))*.08,Sc(t.d)));
 for(const g of dogs)add(Ord(g.d),()=>img(ART.dog,g.x,Yd(g.d),Sc(g.d),pl.x<g.x));
 for(const v of cars)add(Ord(v.laneD),()=>img(v.img,v.x,Yd(v.laneD),Sc(v.laneD),v.dir<0));
 const actorDraw=(a,alpha,boss)=>{if(a.moving)a.anim+=dt;add(Ord(a.d),()=>img(a.fr[frameOf(a)],a.x,Yd(a.d),Sc(a.d)*(boss?1.1:1),a.face<0,alpha))};
 for(const c of crowds)for(const a of c.people)actorDraw(a,1);
 for(const g of goons){const dd=dist(g.a.x,g.a.d,pl.x,pl.d);actorDraw(g.a,blind&&dd>3.5&&state=='play'?.15:1,g.def.boss)}
 if(tib)actorDraw(tib,1,true);
 if(pl.visible){if(pl.moving)pl.anim+=dt;const f=peeking?0:frameOf(pl);add(Ord(pl.d),()=>img(pl.fr[f],pl.x,Yd(pl.d),Sc(pl.d),pl.face<0,hidden&&!peeking?.55:1))}
 list.sort((a,b)=>a.o-b.o);for(const it of list)it.f();
 for(const o of projs){const t=Math.min(1,o.t);img(ART.pebble,o.sx+(o.ex-o.sx)*t,Yd(o.d)+.9+Math.sin(t*Math.PI)*1.2-t*.9,1,false,1,true)}
 // labels
 if(stg.exitSign)label(L-1.2,Yd(1)+1.2,stg.exitSign,'',12,'#2E8B57','#F0ECE0');
 if(stg.terminal){label(L-2.6,Yd(.88)+2.4,'PROBINSYA','',13,'#2A5DA8','#F0ECE0');if(Math.floor(time)%4==0)label(L-4.5,Yd(.9)+2.2,'"Probinsya! Aalis na!"','#F5E6B8',12)}
 for(const g of dogs)if(g.bark>0)label(g.x,Yd(g.d)+1,'AW AW!','#E8467C',12);
 if(state=='play'&&!inside){const tag=hidden?(peeking?'sumisilip':'nakatago'):blended?'halo sa tao':null;if(tag)label(pl.x,headY(pl)+.35,tag,'#3FB8AF',11);
  if(nearHouse)label(nearHouse.x,Yd(1)+1.7,nearHouse.locked?'sarado':'PASOK',nearHouse.locked?'#9A96A0':'#F2A541',12)}
 for(const g of goons){const dd=dist(g.a.x,g.a.d,pl.x,pl.d);if(blind&&dd>3.5&&state=='play')continue;
  if(g.st=='chase'||g.alert>.05){label(g.a.x,headY(g.a)+.3,g.st=='chase'?'!':'?',g.st=='chase'?'#E8467C':'#F2A541',20);
   if(g.st!='chase'){const X=sx(g.a.x),Y=sy(headY(g.a)+.3)-16;ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(X-18,Y,36,3);ctx.fillStyle='#F2A541';ctx.fillRect(X-18,Y,36*Math.min(1,g.alert),3)}}
  if(g.sayT>0)label(g.a.x,headY(g.a)+1.1,g.say,'',12,'rgba(240,236,224,.95)','#16142A')}
 for(const f of fx)if(f.txt){ctx.globalAlpha=clamp01(f.t);label(f.x,headY(pl)+.6+(1.4-f.t)*.5,f.txt,'#F5E6B8',13);ctx.globalAlpha=1}
 if(state=='cutscene'){const line=CUT[Math.min(cutLine,CUT.length-1)];const sp=line[0].startsWith('BOSS')?tib:line[0]=='KULOT'?goons[0].a:null;
  if(sp)label(sp.x,headY(sp)+.7,' ! ','',14,'#E8467C','#F0ECE0');else label(stg.houses[0].x,Yd(1)+2.4,'( ... )','#3FB8AF',15);if(cutLine<=1)shake=Math.max(shake,.1)}
 // vignette + inside tint
 const vg=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.35,W/2,H/2,Math.max(W,H)*.75);vg.addColorStop(0,'rgba(10,8,25,0)');vg.addColorStop(1,'rgba(10,8,25,.75)');ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
 if(state=='play'&&inside){ctx.fillStyle='rgba(13,10,26,.6)';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.fillStyle='#F0ECE0';ctx.font='bold 17px system-ui';
  ctx.fillText(inside.mark?'Nasa loob ka ng bahay mo.':'Nasa loob ka ng bahay ni '+inside.owner+'.',W/2,H*.36);
  if(!inside.mark){ctx.fillStyle='#F2A541';ctx.font='bold 14px system-ui';ctx.fillText(inside.owner+': "Ay! Sino ka?! Lumabas ka!"',W/2,H*.36+26);
   ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(W/2-90,H*.36+44,180,5);ctx.fillStyle='#E8467C';ctx.fillRect(W/2-90,H*.36+44,180*clamp01(1-insideT/8),5)}}
 if(joy.id!==null){ctx.strokeStyle='rgba(255,255,255,.3)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(joy.ox,joy.oy,55,0,7);ctx.stroke();ctx.fillStyle='rgba(255,255,255,.3)';ctx.beginPath();ctx.arc(joy.ox+joy.x*55,joy.oy+joy.y*55,20,0,7);ctx.fill()}
}
function hud(){const mode=inside?'Nasa loob':stun>0?'Nabangga!':hidden?(peeking?'Sumisilip':'Nakatago'):blended?'Halo sa tao':run?'Tumatakbo - maingay':pl.crouch?'Nakayuko':'Naglalakad';
 $('lvl').textContent=stg.name;$('mode').textContent=mode;$('debt').textContent='₱'+debt.toLocaleString();$('cash').textContent='₱'+cash.toLocaleString();
 $('stam').style.width=stam+'%';$('hung').style.width=hunger+'%';$('hung').style.background=hunger<25?'#E8467C':'#E0913A';
 const act=inside?'Labas':nearHouse?(nearHouse.locked?'Sarado':'Pasok'):hidden?'Silip':'—';$('bAct').textContent=act;$('bAct').classList.toggle('on',peeking||!!inside);
 $('bTago').classList.toggle('on',pl.crouch);$('bRun').classList.toggle('on',run);$('bThrow').textContent='Tansan ×'+throws;
 document.body.classList.toggle('playing',state=='play');$('cut').classList.toggle('hide',state!='cutscene');
 if(state=='cutscene'){const l=CUT[Math.min(cutLine,CUT.length-1)];$('cutName').textContent=l[0];$('cutText').textContent=l[1]}
 $('hint').classList.toggle('hide',!(hintT>0&&state=='play'))}
let last=performance.now();
function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;time+=dt;readInput();
 for(let i=fx.length-1;i>=0;i--){const f=fx[i];f.t-=dt;if(!f.txt)f.r+=f.max*dt/.6;if(f.t<=0)fx.splice(i,1)}
 if(shake>0)shake-=dt;if(hintT>0)hintT-=dt;
 if(tib&&((state=='cutscene'&&cutLine>=3)||state=='play')){moveTo(tib,-6,.45,2.2,dt);if(tib.x<-5)tib=null}
 updCrowds(dt);if(state=='play'||state=='cutscene')updTraffic(dt);if(state=='play')tick(dt);
 camX+=(camTarget()-camX)*.1;draw(dt);hud();actDown=false;requestAnimationFrame(loop)}
initArt();loadStage(0,true);titleScreen();requestAnimationFrame(loop);

</script></body></html>
